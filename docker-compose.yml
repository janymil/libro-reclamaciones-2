# ============================================================================
# LibroDigital — production stack for one VPS
# ============================================================================
#   app    : the Node application (this repository, built by ./Dockerfile)
#   caddy  : TLS termination + reverse proxy (automatic Let's Encrypt)
#
# PASSWORDS ARE NOT IN THIS FILE AND NOT IN A .env.
# They are files under ./secrets (mode 600, git-ignored), mounted as Docker
# secrets into /run/secrets and exported by deploy/entrypoint.sh. See
# DEPLOY_VPS.md, section 4.
#
# Before the first start, replace app.example.com (2 places) with the real domain:
#   sed -i "s|app.example.com|app.tudominio.pe|g" docker-compose.yml deploy/Caddyfile
#
# The database is Neon (serverless PostgreSQL over WebSockets). The application
# cannot talk to a plain local PostgreSQL: see DEPLOY_VPS.md, section 7.
# ============================================================================
name: librodigital

services:
  app:
    build:
      context: .
      args:
        # Baked into the client bundle; changing it needs a rebuild.
        VITE_ADMIN_PATH: ${VITE_ADMIN_PATH:-/acceso/operaciones-7f31}
    image: librodigital/app:latest
    restart: unless-stopped
    init: false # tini is already the ENTRYPOINT

    environment:
      NODE_ENV: production
      PORT: "5000"
      # Must be the exact public address users and Mercado Pago see.
      APP_URL: https://app.example.com
      # 1 = one proxy in front of the app (Caddy). Behind Cloudflare's proxy too,
      # set 2. Wrong value => every login looks like one visitor to the limiter.
      TRUST_PROXY: "1"
      ATTACHMENTS_DIR: /data/uploads
      # Same value as the build arg above: the client bakes the path, the server
      # reads it for the noindex header and the platform self-check.
      VITE_ADMIN_PATH: ${VITE_ADMIN_PATH:-/acceso/operaciones-7f31}

      # --- Email (SMTP). The password is a secret, everything else is not. ----
      SMTP_HOST: smtp.zoho.com
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: hola@librodigital.pe
      SMTP_FROM_NAME: LibroDigital.pe
      SMTP_FROM_EMAIL: hola@librodigital.pe

      # --- AI (OpenAI-compatible). The key is a secret. ----------------------
      AI_BASE_URL: https://api.groq.com/openai/v1
      AI_MODEL: openai/gpt-oss-120b
      AI_MODEL_FAST: openai/gpt-oss-20b

      # --- Payments. The access token is a secret. --------------------------
      MERCADOPAGO_SANDBOX: "false"
      PAYMENTS_ALERT_EMAIL: hola@librodigital.pe
      PLATFORM_ADMIN_EMAILS: hola@librodigital.pe

      # --- Optional integrations -------------------------------------------
      RUC_API_PROVIDER: apisnet
      WHATSAPP_API_VERSION: v21.0
      # WHATSAPP_PHONE_NUMBER_ID / WHATSAPP_VERIFY_TOKEN are not secrets; set them
      # here if WhatsApp is enabled.

    secrets:
      - DATABASE_URL
      - SESSION_SECRET
      - SMTP_PASSWORD
      - AI_API_KEY
      - MERCADOPAGO_ACCESS_TOKEN

    volumes:
      # Consumer evidence attachments (2-year retention is enforced by the app).
      - uploads:/data/uploads

    # Not published: Caddy is the only door to the container.
    expose:
      - "5000"

    networks:
      - web

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:
  caddy_data:
  caddy_config:

networks:
  web:

# Docker secrets: read from files outside the image, mounted read-only in memory.
# Create them with mode 600 (DEPLOY_VPS.md, section 4). The names are the
# environment variables the app receives.
secrets:
  DATABASE_URL:
    file: ./secrets/DATABASE_URL.txt
  SESSION_SECRET:
    file: ./secrets/SESSION_SECRET.txt
  SMTP_PASSWORD:
    file: ./secrets/SMTP_PASSWORD.txt
  AI_API_KEY:
    file: ./secrets/AI_API_KEY.txt
  MERCADOPAGO_ACCESS_TOKEN:
    file: ./secrets/MERCADOPAGO_ACCESS_TOKEN.txt
