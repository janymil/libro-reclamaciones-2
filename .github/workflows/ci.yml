name: CI

on:
  push:
    branches: [main]
  pull_request:

# A release gate, not a formality: this is the same chain documented in
# PRODUCTION_READINESS.md ("npm run verify" + build + production audit).
jobs:
  verify:
    name: Verify (typecheck, tests, build, audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (client + server + shared)
        run: npm run check

      - name: Unit and route tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Production dependency audit (fails on high+)
        run: npm run audit:security
